name: Build JnA Dev APK
# Builds a DEBUG-signed APK of the moh_zanzibar_training flavor.
# Debug signing needs no secrets (Android's default debug keystore is used),
# so this workflow runs cleanly on a fork.
#
# Triggered on push of the jna-dev-apk branch and manually via workflow_dispatch.
on:
  push:
    branches: [jna-dev-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: List assemble tasks (for logs)
        run: ./gradlew tasks --all --console=plain 2>&1 | grep -i "assemble.*zanzibar" || true

      - name: Build debug APK for moh_zanzibar_training
        run: |
          ./gradlew assembleMoh_zanzibar_trainingDebug             || ./gradlew assembleMohZanzibarTrainingDebug             || ./gradlew assembleDebug

      - name: Find and rename APK
        run: |
          set -e
          mkdir -p out
          apk=$(find . -type f -name '*moh_zanzibar_training*debug*.apk' | head -1)
          if [ -z "$apk" ]; then apk=$(find . -type f -name '*.apk' | grep -i moh_zanzibar_training | head -1); fi
          if [ -z "$apk" ]; then echo "No APK found" >&2; find . -type f -name '*.apk'; exit 1; fi
          cp "$apk" "out/cht-android-jna-dev-debug.apk"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: cht-android-jna-dev-debug
          path: out/cht-android-jna-dev-debug.apk
          retention-days: 14
